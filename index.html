<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3a2a">
<meta name="description" content="Caderno pessoal para anotar, ouvir e revisar o que estou aprendendo em espanhol.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Espanhol">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Caderno de Espanhol</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme:light;
  --verde:#1a3a2a; --verde-m:#2d5a3d; --verde-c:#4a7c5f;
  --dourado:#c9a84c; --dourado-c:#e8c97a;
  --creme:#f5f0e8; --creme-e:#e0d8c8; --branco:#fdfaf5;
  --texto:#1a2420; --texto-s:#6a7a70;
  --rosa:#d4756a; --azul:#5a8ab0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--branco);color:var(--texto);min-height:100vh;overflow-x:hidden;}
button,input,select,textarea{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--texto);}

/* HEADER */
.hdr{background:linear-gradient(165deg,#0f2219 0%,var(--verde-m) 100%);padding:calc(40px + env(safe-area-inset-top,0px)) 20px 30px;text-align:center;position:relative;overflow:hidden;}
.hdr::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:24px;background:var(--branco);border-radius:24px 24px 0 0;}
.hdr-orb{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.1) 0%,transparent 70%);top:-60px;left:50%;transform:translateX(-50%);pointer-events:none;}
.hdr-date{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dourado);margin-bottom:4px;opacity:.8;}
.hdr-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--creme);}
.hdr-title em{font-style:italic;color:var(--dourado-c);}
.hdr-sum{font-size:12px;color:rgba(245,240,232,.65);margin-top:6px;}

/* CONTENT / TABS */
.content{max-width:720px;margin:0 auto;padding:6px 16px 100px;}
.tabs{display:flex;gap:7px;margin-bottom:18px;overflow-x:auto;padding:2px 0;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--branco);z-index:5;padding-top:10px;padding-bottom:8px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--creme-e);background:white;font-size:13px;color:var(--texto-s);cursor:pointer;white-space:nowrap;font-weight:500;}
.tab.active{background:var(--verde);border-color:var(--verde);color:var(--dourado);}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--rosa);color:white;font-size:11px;line-height:18px;}

/* CARDS */
.card{background:var(--creme);border-radius:16px;padding:16px;margin-bottom:12px;}
.card.white{background:white;border:1px solid var(--creme-e);}
.sec-t{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--verde);margin:6px 2px 4px;}
.sec-s{font-size:12px;color:var(--texto-s);margin:0 2px 14px;line-height:1.5;}
.muted{color:var(--texto-s);font-size:12px;}
.empty{text-align:center;padding:30px 10px;color:var(--texto-s);font-size:13px;line-height:1.6;}

/* FORM */
.inp,textarea.inp{width:100%;padding:9px 11px;border:1.5px solid var(--creme-e);border-radius:10px;background:white;outline:none;min-width:0;}
.inp:focus{border-color:var(--verde-c);}
textarea.inp{min-height:70px;resize:vertical;line-height:1.5;}
.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--texto-s);margin:12px 0 5px;display:block;}
.lbl:first-child{margin-top:0;}
.row{display:flex;gap:8px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.btn{padding:9px 16px;background:var(--verde);color:var(--dourado);border:none;border-radius:10px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap;}
.btn.sec{background:white;color:var(--verde);border:1.5px solid var(--creme-e);}
.btn.danger{background:white;color:var(--rosa);border:1.5px solid rgba(212,117,106,.4);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.big{padding:13px 18px;font-size:15px;flex:1;}
.acentos{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.acentos button{width:34px;height:32px;border-radius:8px;border:1px solid var(--creme-e);background:white;cursor:pointer;font-size:15px;color:var(--verde);}

/* CADERNO */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;}
.fchip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--creme-e);background:white;font-size:12px;cursor:pointer;color:var(--texto-s);}
.fchip.active{background:var(--verde);border-color:var(--verde);color:var(--dourado);}
.item{background:white;border:1px solid var(--creme-e);border-radius:12px;padding:12px;margin-bottom:8px;}
.item-top{display:flex;align-items:flex-start;gap:8px;}
.item .es{font-size:16px;font-weight:600;color:var(--verde);line-height:1.3;}
.item .pt{font-size:14px;margin-top:2px;line-height:1.4;}
.item .ex{font-size:13px;font-style:italic;color:var(--texto-s);margin-top:6px;line-height:1.4;}
.item .nota{font-size:12px;color:var(--texto-s);margin-top:6px;background:var(--creme);border-radius:8px;padding:6px 9px;line-height:1.45;white-space:pre-wrap;}
.item-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.chip{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--creme);color:var(--texto-s);white-space:nowrap;}
.nivel{display:flex;gap:3px;}
.nivel i{width:7px;height:7px;border-radius:50%;background:var(--creme-e);}
.nivel i.on{background:var(--verde-c);}
.ico{width:32px;height:32px;border-radius:50%;border:1px solid var(--creme-e);background:white;cursor:pointer;flex-shrink:0;font-size:14px;line-height:1;color:var(--texto-s);}
.ico.mic{width:38px;height:38px;font-size:16px;}
.btn.play.on{background:var(--verde-c);border-color:var(--verde-c);color:white;}
.fa-trap{font-size:12px;margin-top:8px;background:rgba(212,117,106,.1);border:1px solid rgba(212,117,106,.25);color:#9a4a40;border-radius:8px;padding:6px 9px;line-height:1.45;}
.fa-trap b{color:#7d3a32;}
.card a{color:var(--verde-c);font-weight:600;}
.frase-acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.res{font-size:14px;margin-top:10px;line-height:1.6;}
.res .w{padding:1px 3px;border-radius:5px;}
.res .w.ok{background:rgba(74,124,95,.14);color:var(--verde-m);}
.res .w.no{background:rgba(212,117,106,.16);color:#9a4a40;}
.ico.mic.on,.btn.mic.on{background:var(--rosa);border-color:var(--rosa);color:white;animation:pulsa 1.2s infinite;}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(212,117,106,.5);}70%{box-shadow:0 0 0 10px rgba(212,117,106,0);}100%{box-shadow:0 0 0 0 rgba(212,117,106,0);}}
.campo{display:flex;gap:8px;align-items:flex-start;}

/* REVISAR */
.flash{background:white;border:1px solid var(--creme-e);border-radius:20px;padding:28px 20px;text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px;margin-bottom:12px;}
.flash .lado{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dourado);}
.flash .frente{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--verde);line-height:1.15;word-break:break-word;}
.flash .verso{border-top:1px solid var(--creme-e);padding-top:14px;margin-top:6px;}
.flash .verso .resp{font-size:19px;font-weight:500;line-height:1.35;}
.flash .ex{font-size:13px;font-style:italic;color:var(--texto-s);margin-top:8px;line-height:1.45;}
.flash .ouvido{font-size:13px;margin-top:10px;padding:7px 10px;border-radius:10px;display:inline-block;}
.flash .ouvido.ok{background:rgba(74,124,95,.12);color:var(--verde-m);}
.flash .ouvido.no{background:rgba(212,117,106,.12);color:#9a4a40;}
.flash .nota{font-size:12px;color:var(--texto-s);margin-top:8px;white-space:pre-wrap;line-height:1.45;}
.prog{height:6px;background:var(--creme);border-radius:3px;overflow:hidden;margin-bottom:12px;}
.prog div{height:100%;background:var(--verde-c);transition:width .3s;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--creme);border-radius:12px;padding:12px 8px;text-align:center;}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--verde);font-weight:600;line-height:1;}
.stat span{font-size:11px;color:var(--texto-s);}
.seg{display:flex;border:1.5px solid var(--creme-e);border-radius:10px;overflow:hidden;}
.seg button{flex:1;padding:8px 10px;border:none;background:white;cursor:pointer;font-size:12px;color:var(--texto-s);}
.seg button.active{background:var(--verde);color:var(--dourado);}

.modal-bg{position:fixed;inset:0;background:rgba(15,34,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:900;}
.modal{background:var(--branco);border-radius:18px;padding:20px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.modal p{font-size:14px;line-height:1.5;margin-bottom:14px;}
.modal textarea{min-height:160px;font-size:12px;}
.modal .row{justify-content:flex-end;margin-top:12px;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--verde);color:var(--dourado);padding:10px 22px;border-radius:28px;font-size:13px;z-index:1000;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>

let D, page='caderno', ED=null, EDF=null, busca='', buscaFA='', filtroCat='todas', R=null;

function uid(){ return Math.random().toString(36).slice(2,9); }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    D = (s && Array.isArray(s.itens)) ? s : dadosPadrao();
  }catch(e){ D = dadosPadrao(); }
  D.config = Object.assign(dadosPadrao().config, D.config||{});
  D.frases = D.frases||[];
  D.importadas = D.importadas||[];
  D.apagados = D.apagados||{};
  // as que vêm prontas ficam com carimbo '0': qualquer edição ou exclusão feita em outro aparelho vence
  const novas = DO_CHAT.filter(c=>!D.importadas.includes(c.id));
  novas.forEach(c=>{ D.itens.push(Object.assign(novoItem(c.es,c.pt,c.ex,c.nota,c.cat),{id:c.id,atualizado:'0'})); D.importadas.push(c.id); });
  const novasFr = FRASES_DO_CHAT.filter(c=>!D.importadas.includes(c.id));
  novasFr.forEach(c=>{ D.frases.push({id:c.id, es:c.es, pt:c.pt, criado:agora(), atualizado:'0'}); D.importadas.push(c.id); });
  if(novas.length || novasFr.length) save();
  try{ const pg = localStorage.getItem(KEY+'_page'); if(pg && PAGES.some(x=>x[0]===pg)) page = pg; }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast('Não consegui salvar no navegador'); }
  agendarSync();
}
function agora(){ return new Date().toISOString(); }
function apagar(id){ D.apagados[id]=agora(); }
function item(id){ return D.itens.find(i=>i.id===id); }

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function somaDias(iso,n){
  const [a,m,d]=iso.split('-').map(Number); const dt=new Date(a,m-1,d+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function fmtData(iso){
  if(iso<=hoje()) return 'hoje';
  if(iso===somaDias(hoje(),1)) return 'amanhã';
  const [a,m,d]=iso.split('-').map(Number);
  return new Date(a,m-1,d).toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
}
function paraHoje(){ const h=hoje(); return D.itens.filter(i=>i.prox<=h); }
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sem(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
// sem acento, pontuação e maiúsculas, para comparar o que foi falado
function limpa(s){ return sem(s).replace(/[¿?¡!.,;:"“”()]/g,' ').replace(/\s+/g,' ').trim(); }

function fecharModal(){ document.getElementById('modal').innerHTML=''; }
let _modalOk=null;
function pedir(msg,ok,txtOk){
  _modalOk=ok;
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal"><p>${esc(msg)}</p>
    <div class="row"><button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" onclick="const f=_modalOk;fecharModal();f()">${esc(txtOk||'Confirmar')}</button></div></div></div>`;
}
function caixaTexto(titulo,texto,ok,txtOk){
  _modalOk=ok;
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal"><p>${esc(titulo)}</p>
    <textarea class="inp" id="modalTxt">${esc(texto||'')}</textarea>
    <div class="row"><button class="btn sec" onclick="fecharModal()">Fechar</button>${ok?`<button class="btn" onclick="const v=document.getElementById('modalTxt').value;const f=_modalOk;fecharModal();f(v)">${esc(txtOk||'OK')}</button>`:''}</div></div></div>`;
  const ta=document.getElementById('modalTxt'); if(!ok){ ta.focus(); ta.select(); }
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200);
}
function copiar(t,msg){
  const manual=()=>caixaTexto('Selecione e copie o texto abaixo:',t);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast(msg),manual);
    else manual();
  }catch(e){ manual(); }
}
// voz em espanhol da Espanha (es-ES); se o aparelho não tiver, usa outra voz em espanhol
function vozES(){
  const vs=speechSynthesis.getVoices(), lg=v=>v.lang.replace('_','-').toLowerCase();
  return vs.find(v=>lg(v)==='es-es') || vs.find(v=>lg(v).startsWith('es'));
}
function temVozEspanha(){ return 'speechSynthesis' in window && speechSynthesis.getVoices().some(v=>v.lang.replace('_','-').toLowerCase()==='es-es'); }
function falar(t, devagar, btn, emFila){
  if(!('speechSynthesis' in window)){ toast('Este navegador não fala 😕'); return; }
  if(!emFila) speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='es-ES'; u.rate=devagar?.6:.9;
  const v=vozES(); if(v) u.voice=v;
  if(btn){ btn.classList.add('on'); u.onend=u.onerror=()=>btn.classList.remove('on'); }
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let _rec=null;
// escuta uma fala e chama aoOuvir(texto, final) a cada trecho reconhecido
function ouvir(lang, btn, aoOuvir){
  if(!SR){ toast('Este navegador não reconhece voz 😕'); return; }
  if(_rec){ const era=_rec._btn; _rec.stop(); if(era===btn) return; }
  const r=new SR(); r.lang=lang; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  r._btn=btn; _rec=r; if(btn) btn.classList.add('on');
  r.onresult=e=>{
    let t=''; for(let k=0;k<e.results.length;k++) t+=e.results[k][0].transcript;
    aoOuvir(t.trim(), e.results[e.results.length-1].isFinal);
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed') toast('Permita o uso do microfone 🎤');
    else if(e.error==='no-speech') toast('Não ouvi nada, tente de novo');
    else if(e.error!=='aborted') toast('Não consegui ouvir ('+e.error+')');
  };
  r.onend=()=>{ if(btn) btn.classList.remove('on'); if(_rec===r) _rec=null; };
  try{ r.start(); }catch(e){ r.onend(); toast('Não consegui ligar o microfone'); }
}
function ditar(campo, lang, btn){
  const el=document.getElementById('f_'+campo);
  const base=el.value.trim();
  ouvir(lang, btn, t=>{ el.value = base ? base+' '+t : t; });
}
function micBtn(campo, lang){ return SR ? `<button type="button" class="ico mic" title="Falar" onclick="ditar('${campo}','${lang}',this)">🎤</button>` : ''; }
function falarItem(id){ const i=item(id); if(i) falar(i.es); }
function nivelHtml(n){ let h='<span class="nivel" title="nível '+n+' de '+NIVEL_MAX+'">'; for(let k=1;k<=NIVEL_MAX;k++) h+=`<i class="${k<=n?'on':''}"></i>`; return h+'</span>'; }

function go(p){ if(_rec) _rec.abort(); if('speechSynthesis' in window) speechSynthesis.cancel(); page=p; if(p!=='adicionar') ED=null; if(p!=='frases') EDF=null; if(p!=='revisar') R=null; try{localStorage.setItem(KEY+'_page',p);}catch(e){} render(); window.scrollTo({top:0}); }
function render(){
  const due=paraHoje().length;
  document.getElementById('tabs').innerHTML = PAGES.map(([id,nm])=>`<button class="tab ${page===id?'active':''}" onclick="go('${id}')">${id==='adicionar'&&ED?'Editar':nm}${id==='revisar'&&due?`<span class="n">${due}</span>`:''}</button>`).join('');
  document.getElementById('hdrSum').textContent = textoTopo();
  const fn={caderno:pgCaderno,frases:pgFrases,falsos:pgFalsos,revisar:pgRevisar,adicionar:pgAdicionar,ajustes:pgAjustes}[page];
  document.getElementById('page').innerHTML=fn();
  if(page==='adicionar' && !ED) setTimeout(()=>{ const e=document.getElementById('f_es'); if(e && matchMedia('(hover:hover)').matches) e.focus(); },0);
}

function pgCaderno(){
  if(!D.itens.length) return `<div class="empty">Seu caderno ainda está vazio.<br>Anote uma palavra, expressão ou regra que você aprendeu para revisar depois.<br><br>
    <button class="btn" onclick="go('adicionar')">+ Anotar a primeira</button></div>`;
  const cats=CATS.filter(c=>D.itens.some(i=>i.cat===c));
  return `<input class="inp" id="busca" placeholder="🔎 Buscar em espanhol ou português…" value="${esc(busca)}" oninput="busca=this.value;renderLista()">
  ${cats.length>1?`<div class="filters">${['todas',...cats].map(c=>`<button class="fchip ${filtroCat===c?'active':''}" onclick="filtroCat='${c}';render()">${c==='todas'?'Todas':c}</button>`).join('')}</div>`:'<div style="height:12px"></div>'}
  <div id="lista">${listaHtml()}</div>`;
}
function renderLista(){ document.getElementById('lista').innerHTML=listaHtml(); }
function listaHtml(){
  const q=sem(busca.trim());
  const lista=D.itens
    .filter(i=>filtroCat==='todas'||i.cat===filtroCat)
    .filter(i=>!q||sem([i.es,i.pt,i.ex,i.nota].join(' ')).includes(q))
    .sort((a,b)=>b.criado.localeCompare(a.criado));
  if(!lista.length) return `<div class="empty">Nada encontrado.</div>`;
  return lista.map(i=>`<div class="item">
    <div class="item-top">
      <div style="flex:1;min-width:0">
        <div class="es">${esc(i.es)}</div>
        <div class="pt">${esc(i.pt)}</div>
      </div>
      <button class="ico" onclick="falarItem('${i.id}')" title="Ouvir">🔊</button>
      <button class="ico" onclick="editar('${i.id}')" title="Editar">✎</button>
    </div>
    ${i.ex?`<div class="ex">“${esc(i.ex)}”</div>`:''}
    ${i.nota?`<div class="nota">${esc(i.nota)}</div>`:''}
    <div class="item-meta">${i.cat?`<span class="chip">${esc(i.cat)}</span>`:''}${nivelHtml(i.nivel)}<span class="muted" style="margin-left:auto">revisar ${fmtData(i.prox)}</span></div>
  </div>`).join('');
}

function acentosHtml(){ return `<div class="acentos">${['á','é','í','ó','ú','ñ','ü','¿','¡'].map(c=>`<button type="button" onmousedown="event.preventDefault()" onclick="inserir('${c}')">${c}</button>`).join('')}</div>`; }
function pgFrases(){
  let h=`<div class="sec-t">Frases para treinar</div>
  <div class="sec-s">Escreva ou dite as frases que quer treinar. Toque em <b>▶ Ouvir</b> para escutar com o sotaque da Espanha, <b>🐢</b> para ouvir devagar e <b>🎤 Falar</b> para repetir e ver se entendi tudo.</div>
  <div class="card white">
    <label class="lbl">Frase em espanhol</label>
    <div class="campo"><textarea class="inp" id="f_fes" placeholder="ex.: ¿Me puedes ayudar, por favor?" onfocus="ultimo=this" autocapitalize="sentences"></textarea>${micBtn('fes','es-ES')}</div>
    <label class="lbl">Tradução (opcional)</label>

  h+=D.frases.slice().sort((a,b)=>b.criado.localeCompare(a.criado)).map(f=> f.id===EDF ? `<div class="item" id="ed_${f.id}">
    <label class="lbl">Frase em espanhol</label>

    <label class="lbl">Tradução (opcional)</label>

    <div class="row wrap" style="margin-top:12px">
      <button class="btn" onclick="salvarEdicaoFrase()">Salvar</button>

function avisoVoz(){
  return 'speechSynthesis' in window && speechSynthesis.getVoices().length && !temVozEspanha()
    ? '⚠️ Este aparelho não tem voz da Espanha instalada, então vou usar outra voz em espanhol. No iPhone: Ajustes › Acessibilidade › Conteúdo Falado › Vozes › Espanhol › Espanha.' : '';
}
function frase(id){ return D.frases.find(f=>f.id===id); }
function falarFrase(id,devagar,btn){ const f=frase(id); if(f) falar(f.es,devagar,btn); }
function ouvirTodas(btn){
  speechSynthesis.cancel();
  const lista=D.frases.slice().sort((a,b)=>b.criado.localeCompare(a.criado));
  lista.forEach((f,k)=>falar(f.es,false,k===lista.length-1?btn:null,true));

function salvarEdicaoFrase(){
  const es=document.getElementById('f_efes').value.trim(), pt=document.getElementById('f_efpt').value.trim();

function excluirFrase(id){
  pedir(`Excluir “${frase(id).es}”?`,()=>{ D.frases=D.frases.filter(f=>f.id!==id); apagar(id); EDF=null; save(); render(); toast('Excluída'); },'Excluir');
}
// ouve a pessoa repetindo a frase e marca as palavras que reconheceu (verde) ou não (vermelho)
function treinarFrase(id,btn){
  const f=frase(id), res=document.getElementById('res_'+id);
  ouvir('es-ES', btn, (t,final)=>{
    if(!final){ res.innerHTML=`<span class="muted">🎤 ${esc(t)}</span>`; return; }
    const ditas=limpa(t).split(' ');
    const alvo=f.es.split(/\s+/).filter(w=>limpa(w));
    const ok=alvo.map(w=>{ const k=ditas.indexOf(limpa(w)); if(k>=0) ditas.splice(k,1); return k>=0; });
    const marcadas=alvo.map((w,k)=>`<span class="w ${ok[k]?'ok':'no'}">${esc(w)}</span>`);
    const certas=ok.filter(Boolean).length;
    res.innerHTML = (certas===alvo.length ? '<b style="color:var(--verde-m)">¡Perfecto! 🎉</b><br>' : `<span class="muted">Entendi ${certas} de ${alvo.length} palavras. Em vermelho, o que não reconheci:</span><br>`)
      + marcadas.join(' ') + `<div class="muted" style="margin-top:4px">Você disse: “${esc(t)}”</div>`;
  });
}

function iniciar(treino){
  const base = treino ? D.itens.slice() : paraHoje();
  R={fila:embaralhar(base.map(i=>i.id)), pos:0, aberto:false, ouvido:null, treino, vistos:{}, certas:0, erros:0, total:base.length};

function pgRevisar(){
  if(!D.itens.length) return `<div class="empty">Anote algumas coisas primeiro e depois volte aqui para revisar.<br><br><button class="btn" onclick="go('adicionar')">+ Anotar</button></div>`;

    <button class="${S==='pt-es'?'active':''}" onclick="setSentido('pt-es')">Português → Espanhol</button></div>`;

  if(!R){
    const due=paraHoje().length;
    const dominadas=D.itens.filter(i=>i.nivel>=5).length;
    let h=`<div class="stats">
      <div class="stat"><b>${due}</b><span>para hoje</span></div>

    if(due) h+=`<button class="btn big" style="width:100%" onclick="iniciar(false)">Revisar ${due} agora</button>`;
    else{

        <div class="muted" style="margin-top:4px">Próxima revisão: ${fmtData(prox)}</div></div>
        <button class="btn sec big" style="width:100%" onclick="iniciar(true)">Treinar tudo mesmo assim</button>
        <div class="muted" style="margin-top:8px;text-align:center">No treino livre as datas de revisão não mudam.</div>`;
    }
    return h;
  }

  if(R.pos>=R.fila.length){
    return `<div class="card" style="text-align:center;padding:26px 16px">
      <div class="sec-t" style="margin:0">¡Muy bien! 🎉</div>
      <div class="muted" style="margin-top:6px">${R.total} revisada${R.total>1?'s':''} · ${R.certas} de primeira${R.erros?` · ${R.erros} para reforçar`:''}</div></div>
      <div class="row"><button class="btn big" onclick="R=null;render()">Concluir</button></div>`;
  }

  const i=item(R.fila[R.pos]);

  const frente = S==='es-pt' ? i.es : i.pt;
  const verso  = S==='es-pt' ? i.pt : i.es;
  const feitas=Object.keys(R.vistos).length;
  return `<div class="prog"><div style="width:${Math.round(feitas/R.total*100)}%"></div></div>
  <div class="muted" style="margin-bottom:8px">${feitas} de ${R.total}${R.treino?' · treino livre':''}</div>
  <div class="flash">
    <div class="lado">${S==='es-pt'?'español':'português'}${i.cat?' · '+esc(i.cat):''}</div>
    <div class="frente">${esc(frente)}</div>
    ${S==='es-pt'?`<div><button class="ico" onclick="falarItem('${i.id}')">🔊</button></div>`:''}
    ${R.aberto?`<div class="verso">
      <div class="resp">${esc(verso)}</div>
      ${S==='pt-es'?`<div style="margin-top:8px"><button class="ico" onclick="falarItem('${i.id}')">🔊</button></div>`:''}
      ${R.ouvido!=null?`<div class="ouvido ${confere(R.ouvido,verso)?'ok':'no'}">${confere(R.ouvido,verso)?'✓':'🎤'} Você disse: “${esc(R.ouvido)}”</div>`:''}
      ${i.ex?`<div class="ex">“${esc(i.ex)}”</div>`:''}
      ${i.nota?`<div class="nota">${esc(i.nota)}</div>`:''}
    </div>`:''}
  </div>
  ${R.aberto
    ? `<div class="row"><button class="btn danger big" onclick="responder(false)">Ainda não 😅</button><button class="btn big" onclick="responder(true)">Sabia ✓</button></div>`
    : `<div class="row">${SR?`<button class="btn sec big mic" onclick="responderFalando(this,'${S==='es-pt'?'pt-BR':'es-ES'}')">🎤 Falar a resposta</button>`:''}<button class="btn big" onclick="R.aberto=true;render()">Mostrar resposta</button></div>`}
  <div style="text-align:center;margin-top:14px"><button class="btn sec sm" onclick="R=null;render()">Parar revisão</button></div>`;
}
function responder(sabia){
  const id=R.fila[R.pos], i=item(id);
  // só a primeira resposta da sessão conta para o agendamento
  if(!R.vistos[id]){
    R.vistos[id]=true;
    if(sabia) R.certas++; else R.erros++;
    if(!R.treino){
      i.nivel = sabia ? Math.min(i.nivel+1,NIVEL_MAX) : 0;
      i.prox = somaDias(hoje(), INTERVALOS[i.nivel]);
      i.atualizado = agora();
      save();
    }
  }
  if(!sabia) R.fila.push(id);  // volta no fim da fila até acertar
  R.pos++; R.aberto=false; R.ouvido=null; render();
}
function responderFalando(btn, lang){
  ouvir(lang, btn, (t,final)=>{ btn.textContent='🎤 '+t; if(final){ R.ouvido=t; R.aberto=true; render(); } });
}
// compara a fala com a resposta, ignorando acentos, pontuação e maiúsculas; aceita qualquer opção separada por / , ;
function confere(fala, resp){
  const f=limpa(fala);
  return resp.split(/[\/,;]/).map(limpa).filter(Boolean).some(o=>o===f);
}
function setSentido(s){ D.config.sentido=s; save(); if(R){ R.aberto=false; R.ouvido=null; } render(); }

let ultimo=null;

  const v=k=>document.getElementById('f_'+k).value.trim();

function adicionarLote(){
  const linhas=document.getElementById('f_lote').value.split('\n').map(l=>l.trim()).filter(Boolean);

  linhas.forEach(l=>{
    const [par,ex]=l.split('|').map(s=>s.trim());
    const m=par.match(/^(.+?)\s*(?:=|\t|\s[-–—]\s)\s*(.+)$/);
    if(!m){ ruins.push(l); return; }
    D.itens.push(novoItem(m[1].trim(),m[2].trim(),ex||'','','')); n++;
  });
  if(n) save();
  if(ruins.length){ render(); document.getElementById('f_lote').value=ruins.join('\n'); toast(`${n} adicionada${n===1?'':'s'} · ${ruins.length} sem “=”`); }

/* ============================================================
   SINCRONIZAÇÃO (computador ⇄ celular)
   os dados ficam num gist privado da conta do GitHub; cada aparelho
   junta a sua cópia com a de lá, item por item, ficando com a versão
   mais recente de cada um. Nada é substituído por inteiro.
   ============================================================ */
const GIST_ARQ = 'caderno-espanhol.json';
let SY = {estado:'off', quando:'', msg:''}, _syncT=null, _syncRodando=false, _syncDeNovo=false;

function syncCfg(){ try{ return JSON.parse(localStorage.getItem(KEY+'_sync'))||null; }catch(e){ return null; } }
function setSyncCfg(c){ try{ c ? localStorage.setItem(KEY+'_sync',JSON.stringify(c)) : localStorage.removeItem(KEY+'_sync'); }catch(e){} }
function textoTopo(){
  const n=D.itens.length, due=paraHoje().length;
  return (n ? `${n} anotaç${n>1?'ões':'ão'} · ${due?due+' para revisar hoje':'revisão em dia ✓'}` : 'comece anotando o que aprendeu') + iconeSync();
}
function iconeSync(){
  if(!syncCfg()) return '';
  return {ok:' · ☁️ sincronizado', sinc:' · ☁️ sincronizando…', erro:' · ⚠️ sem sincronizar', off:' · ☁️'}[SY.estado]||'';
}
function marcarSync(estado,msg){
  SY.estado=estado; SY.msg=msg||'';
  if(estado==='ok') SY.quando=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('hdrSum').textContent = textoTopo();
  const el=document.getElementById('syncStatus'); if(el) el.innerHTML=statusSyncHtml();
}
async function gh(caminho, token, opt){
  const r = await fetch('https://api.github.com'+caminho, Object.assign({cache:'no-store'}, opt||{}, {
    headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'Content-Type':'application/json'}}));
  if(r.status===401) throw new Error('chave');
  if(!r.ok) throw new Error('GitHub respondeu '+r.status);
  return r.json();
}
function dadosParaNuvem(d){
  const porId=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
  return {versao:1, itens:d.itens.slice().sort(porId), frases:d.frases.slice().sort(porId),
    apagados:Object.fromEntries(Object.entries(d.apagados||{}).sort()), importadas:(d.importadas||[]).slice().sort()};
}
function carimbo(x){ return x.atualizado||x.criado||''; }
// junta duas cópias: de cada item fica a versão mais recente; o que foi excluído em qualquer lado sai
function mesclar(a,b){
  const ap=Object.assign({}, b.apagados||{});
  Object.entries(a.apagados||{}).forEach(([id,t])=>{ if(!ap[id]||t>ap[id]) ap[id]=t; });
  const junta=(x,y)=>{
    const m=new Map();
    [...(x||[]),...(y||[])].forEach(i=>{ const o=m.get(i.id); if(!o||carimbo(i)>carimbo(o)) m.set(i.id,i); });
    return [...m.values()].filter(i=>!(ap[i.id] && ap[i.id]>=carimbo(i)));
  };
  return Object.assign({}, a, {itens:junta(a.itens,b.itens), frases:junta(a.frases,b.frases), apagados:ap,
    importadas:[...new Set([...(a.importadas||[]),...(b.importadas||[])])]});
}
async function lerGist(cfg){
  const g=await gh('/gists/'+cfg.gist, cfg.token);
  const f=g.files && g.files[GIST_ARQ];
  if(!f) return {itens:[],frases:[],apagados:{},importadas:[]};
  const txt = f.truncated ? await (await fetch(f.raw_url,{cache:'no-store'})).text() : f.content;
  return JSON.parse(txt||'{}');
}
async function gravarGist(cfg, dados){
  await gh('/gists/'+cfg.gist, cfg.token, {method:'PATCH', body:JSON.stringify({files:{[GIST_ARQ]:{content:JSON.stringify(dados)}}})});
}
function agendarSync(){ if(!syncCfg()) return; clearTimeout(_syncT); _syncT=setTimeout(sincronizar,1500); }
async function sincronizar(){
  const cfg=syncCfg(); if(!cfg) return;
  if(_syncRodando){ _syncDeNovo=true; return; }
  _syncRodando=true; marcarSync('sinc');
  try{
    const remoto=await lerGist(cfg);
    const antes=JSON.stringify(dadosParaNuvem(D));
    D=mesclar(D,remoto);
    const depois=dadosParaNuvem(D), txt=JSON.stringify(depois);
    try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){}
    if(txt!==JSON.stringify(dadosParaNuvem(Object.assign({apagados:{},importadas:[],itens:[],frases:[]},remoto)))) await gravarGist(cfg, depois);
    marcarSync('ok');
    // só redesenha se chegou algo novo e a pessoa não está digitando nem no meio de uma revisão
    const ativo=document.activeElement;
    if(txt!==antes && !R && !(ativo && /INPUT|TEXTAREA/.test(ativo.tagName))) render();
  }catch(e){
    marcarSync('erro', e.message==='chave' ? 'A chave do GitHub não funcionou (pode ter expirado). Desligue e conecte de novo.'
      : !navigator.onLine ? 'Sem internet. Quando voltar, eu sincronizo.'
      : e instanceof TypeError ? 'Não consegui falar com o GitHub agora. Tento de novo mais tarde.' : e.message);
  }finally{
    _syncRodando=false;
    if(_syncDeNovo){ _syncDeNovo=false; agendarSync(); }
  }
}
async function conectarSync(){
  const token=document.getElementById('f_token').value.trim();
  if(!token){ toast('Cole a chave do GitHub'); return; }
  const btn=document.getElementById('btnConectar'); btn.disabled=true; btn.textContent='Conectando…';
  try{
    // procura um gist do caderno já criado em outro aparelho; se não houver, cria
    let gist=null;
    for(let pg=1; pg<=5 && !gist; pg++){
      const lista=await gh('/gists?per_page=100&page='+pg, token);
      gist=(lista.find(g=>g.files && g.files[GIST_ARQ])||{}).id || null;
      if(lista.length<100) break;
    }
    if(!gist){
      const g=await gh('/gists', token, {method:'POST', body:JSON.stringify({description:'Caderno de Espanhol (dados do app, não apagar)', public:false,
        files:{[GIST_ARQ]:{content:JSON.stringify(dadosParaNuvem(D))}}})});
      gist=g.id;
    }
    setSyncCfg({token, gist});
    await sincronizar();
    if(SY.estado==='ok') toast('Sincronização ligada ☁️');
    render();
  }catch(e){
    toast(e.message==='chave' ? 'Essa chave não funcionou' : 'Não consegui conectar');
    btn.disabled=false; btn.textContent='Conectar';
  }
}
function desconectarSync(){
  pedir('Desligar a sincronização neste aparelho? As anotações continuam aqui e na nuvem.',()=>{ setSyncCfg(null); SY={estado:'off',quando:'',msg:''}; render(); },'Desligar');
}
function statusSyncHtml(){
  if(SY.estado==='sinc') return '☁️ Sincronizando…';
  if(SY.estado==='erro') return `<span style="color:#9a4a40">⚠️ ${esc(SY.msg)}</span>`;
  if(SY.estado==='ok') return `✓ Sincronizado às ${SY.quando}`;
  return '☁️ Ligada';
}
window.addEventListener('online', agendarSync);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') agendarSync(); });

/* ============================================================
   PÁGINA: AJUSTES
   ============================================================ */
function pgAjustes(){
  const cfg=syncCfg();
  const sync = cfg ? `<div class="card">
    <div id="syncStatus" style="font-size:14px;margin-bottom:10px">${statusSyncHtml()}</div>
    <div class="muted" style="margin-bottom:10px">Tudo que você anotar aqui aparece nos outros aparelhos conectados, e vice-versa. Funciona também sem internet: quando voltar, eu junto as mudanças.</div>
    <div class="row wrap"><button class="btn" onclick="sincronizar()">Sincronizar agora</button><button class="btn sec" onclick="desconectarSync()">Desligar neste aparelho</button></div>
  </div>` : `<div class="card">
    <div class="muted" style="margin-bottom:10px;line-height:1.6">Use no computador e no celular com as mesmas anotações. Elas ficam guardadas num arquivo privado da sua conta do GitHub. Faça isso <b>uma vez em cada aparelho</b>, com a mesma chave:</div>
    <ol class="muted" style="margin:0 0 12px 18px;line-height:1.7">
      <li>Abra <a href="https://github.com/settings/tokens/new?scopes=gist&description=Caderno%20de%20Espanhol" target="_blank" rel="noopener">este link do GitHub</a> (já vem com a opção certa marcada: <b>gist</b>).</li>
      <li>Em <b>Expiration</b>, escolha <b>No expiration</b>.</li>
      <li>Clique em <b>Generate token</b> e copie o código que começa com <b>ghp_</b>.</li>
      <li>Cole aqui e toque em <b>Conectar</b>. Guarde o código para colar no outro aparelho.</li>
    </ol>
    <input class="inp" id="f_token" placeholder="ghp_…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row" style="margin-top:10px"><button class="btn" id="btnConectar" onclick="conectarSync()">Conectar</button></div>
  </div>`;
  return `<div class="sec-t">Computador e celular</div>${sync}
  <div class="sec-t" style="margin-top:22px">Backup</div>
  <div class="card">
    <div class="muted" style="margin-bottom:10px">As anotações ficam salvas neste navegador. Copie o backup para guardar ou levar para outro aparelho.</div>
    <div class="row wrap"><button class="btn" onclick="copiar(JSON.stringify(D),'Backup copiado 📋')">Copiar backup</button>
    <button class="btn sec" onclick="importar()">Restaurar backup</button>
    <button class="btn sec" onclick="copiarTexto()">Copiar como lista</button></div>
  </div>
  <div class="sec-t" style="margin-top:22px">Como funciona a revisão</div>
  <div class="card"><div class="muted" style="line-height:1.6">Cada anotação nova entra na revisão do mesmo dia. Quando você acerta, ela sobe de nível e volta cada vez mais espaçada: <b>1, 3, 7, 14, 30 e 60 dias</b>. Se errar, ela volta para o começo e reaparece amanhã. Assim você revisa mais o que ainda não fixou.</div></div>`;
}
function copiarTexto(){
  if(!D.itens.length){ toast('O caderno está vazio'); return; }
  const t=D.itens.slice().sort((a,b)=>a.es.localeCompare(b.es,'es')).map(i=>`${i.es} = ${i.pt}${i.ex?' | '+i.ex:''}`).join('\n');
  copiar(t,'Lista copiada 📋');
}
function importar(){
  caixaTexto('Cole aqui o backup copiado antes:','',t=>{
    try{ const d=JSON.parse(t); if(!Array.isArray(d.itens)) throw 0; D=d; save(); load(); R=null; render(); toast('Backup restaurado ✓'); }
    catch(e){ toast('Backup inválido: cole o texto completo'); }
  },'Restaurar');
}

if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  // as vozes carregam depois da página; atualiza o aviso de voz da aba Frases
  speechSynthesis.onvoiceschanged=()=>{ const a=document.getElementById('avisoVoz'); if(a) a.innerHTML=avisoVoz(); };
}
load(); render();
if(syncCfg()) sincronizar();

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
